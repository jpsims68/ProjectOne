name: Governance

permissions:
  contents: read

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: governance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-layout:
    name: Repository layout
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Refuse flattened or misplaced files
        run: python3 governance/scripts/check_repository_layout.py

  slice-boundaries:
    name: Slice boundaries (VSA-1 / VSA-3)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Enforce slice boundaries and manifests
        run: python3 governance/scripts/check_slice_boundaries.py

  secret-protection:
    name: Secret protection (non-waivable invariant)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Refuse committed secret values
        run: python3 governance/scripts/check_no_secrets.py

  pr-governance:
    name: PR governance metadata
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Write PR body to file
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: printf '%s' "$PR_BODY" > /tmp/pr_body.md
      - name: Check required governance metadata
        run: python3 governance/scripts/check_pr_governance.py /tmp/pr_body.md

  cloud-target-compatibility:
    name: Azure SQL Database compatibility (FR-010)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Refuse SQL that cannot run on Azure SQL Database
        # Scans files only. Never connects to a database, never executes SQL.
        run: python3 governance/scripts/check_cloud_target_compatibility.py

  overlay-reachability:
    name: Overlay reachability
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Refuse an approved overlay its target never mentions
        run: python3 governance/scripts/check_overlay_reachability.py

  data-reproducible:
    name: Generated data reproducible
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Refuse committed data that its generator cannot reproduce
        run: python3 governance/scripts/check_generated_data_reproducible.py

  baseline-integrity:
    name: Framework baseline integrity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify frozen framework baseline hashes
        run: python3 governance/scripts/check_baseline_integrity.py
