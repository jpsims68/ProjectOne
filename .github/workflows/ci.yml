name: CI

permissions:
  contents: read

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# ---------------------------------------------------------------------------
# GATE DISCIPLINE
#
# Every step below either does its work or FAILS. No step may conclude "target
# absent, therefore pass" — the skip-and-pass pattern prohibited by the
# framework doNotDo list, and what allowed the previous revision to report
# green while never running a test, installing a dependency, auditing a
# package, or scanning a line of source.
#
# Absent-expected is asserted explicitly. Absent-unexpected fails the build.
#
# Job `name:` values ARE the required-status-check names in the `main
# protection` ruleset. Renaming a job silently detaches its required check.
# ---------------------------------------------------------------------------

jobs:
  build-and-test:
    name: Build, lint, test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Must match pyproject requires-python (>=3.13,<3.14) and the
          # technology registry. The previous revision pinned 3.12, which the
          # smoke test would have rejected had it ever run.
          python-version: '3.13'

      - name: Install unixODBC
        # pyodbc links libodbc.so.2 at import. Without this the dependency
        # import test fails for an environmental reason.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq unixodbc

      - name: Verify expected layout
        run: |
          for path in pyproject.toml app tests; do
            if [ ! -e "$path" ]; then
              echo "::error::Required path '$path' is missing — absent-unexpected."
              exit 1
            fi
          done
          echo "Layout verified: pyproject.toml, app/, tests/ present."

      - name: Install dependencies
        # The project is NOT installed as a package. It has no [build-system] and a
        # flat layout, so setuptools auto-discovery sees app/ and governance/ as two
        # top-level packages and errors. Declaring packaging config now would be a
        # premature decision (production implementation is NOT AUTHORIZED), so
        # dependencies are read straight from pyproject.toml — still one source of
        # truth — and app/ is importable because pytest puts rootdir on sys.path.
        run: |
          # pip is upgraded because pip-audit audits the RESOLVED ENVIRONMENT, and
          # pip is part of it. The pip shipped by setup-python lagged behind the
          # fixes for PYSEC-2026-1796 / -196 / -2875 / -2876, so an un-upgraded pip
          # fails the Security scan on its own account. Verified in a clean venv:
          # pip 24.0 reports 4 vulnerabilities, pip 26.2.1 reports none.
          python -m pip install --upgrade pip
          pip --version
          python - > /tmp/requirements-ci.txt <<'PY'
          import tomllib
          d = tomllib.load(open("pyproject.toml", "rb"))
          print("\n".join(list(d["project"]["dependencies"]) + list(d["dependency-groups"]["dev"])))
          PY
          cat /tmp/requirements-ci.txt
          pip install -r /tmp/requirements-ci.txt

      - name: Verify interpreter matches declared range
        run: |
          python -c "import sys; assert sys.version_info[:2]==(3,13), f'Expected 3.13.x, got {sys.version.split()[0]}'; print('Interpreter OK:', sys.version.split()[0])"

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Type check
        # governance/scripts is deliberately in scope: those are the active CI
        # enforcement checks, held to the same standard as application code.
        run: mypy app tests governance/scripts

      - name: Test
        # local_env marks tests needing the owner's machine (SQL Server, ODBC
        # Driver 18). Everything else must run and pass here.
        run: pytest -q -m "not local_env"

  security-scan:
    name: Security scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install unixODBC
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq unixodbc

      - name: Install dependencies
        # The project is NOT installed as a package. It has no [build-system] and a
        # flat layout, so setuptools auto-discovery sees app/ and governance/ as two
        # top-level packages and errors. Declaring packaging config now would be a
        # premature decision (production implementation is NOT AUTHORIZED), so
        # dependencies are read straight from pyproject.toml — still one source of
        # truth — and app/ is importable because pytest puts rootdir on sys.path.
        run: |
          # pip is upgraded because pip-audit audits the RESOLVED ENVIRONMENT, and
          # pip is part of it. The pip shipped by setup-python lagged behind the
          # fixes for PYSEC-2026-1796 / -196 / -2875 / -2876, so an un-upgraded pip
          # fails the Security scan on its own account. Verified in a clean venv:
          # pip 24.0 reports 4 vulnerabilities, pip 26.2.1 reports none.
          python -m pip install --upgrade pip
          pip --version
          python - > /tmp/requirements-ci.txt <<'PY'
          import tomllib
          d = tomllib.load(open("pyproject.toml", "rb"))
          print("\n".join(list(d["project"]["dependencies"]) + list(d["dependency-groups"]["dev"])))
          PY
          cat /tmp/requirements-ci.txt
          pip install -r /tmp/requirements-ci.txt

      - name: Dependency vulnerability scan
        # Audits the resolved environment. The previous revision audited a
        # requirements.txt that does not exist and passed unconditionally.
        run: pip-audit --strict

      - name: Static security analysis
        # Targets app/. The previous revision targeted slices/ and platform/,
        # neither of which exists, and passed unconditionally.
        run: |
          if [ ! -d app ]; then
            echo "::error::app/ is missing — nothing to scan. Absent-unexpected."
            exit 1
          fi
          bandit -r app -q
